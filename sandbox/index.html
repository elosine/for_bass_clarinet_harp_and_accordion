<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Harp Probe — sandbox v0</title>
<style>
  /* Minimal on purpose — look & feel deferred (docs/UX_NOTES.md) */
  body { font-family: system-ui, sans-serif; margin: 24px; background: #1e1e22; color: #ddd; }
  h1 { font-size: 16px; font-weight: 600; color: #aaa; margin: 0 0 16px; }
  .row { display: flex; align-items: center; gap: 16px; margin: 14px 0; flex-wrap: wrap; }
  select { font-size: 15px; padding: 6px 10px; background: #2a2a30; color: #ddd; border: 1px solid #444; border-radius: 6px; }
  #banner { display: none; background: #7a2a2a; color: #fff; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }

  /* Keyboard */
  #kbd { position: relative; height: 120px; user-select: none; margin: 18px 0 6px; white-space: nowrap; overflow-x: auto; padding-bottom: 6px; }
  .wk { display: inline-block; width: 26px; height: 110px; background: #f4f2ee; border: 1px solid #555; border-radius: 0 0 4px 4px; position: relative; cursor: pointer; vertical-align: top; }
  .wk .lbl { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 9px; color: #666; pointer-events: none; }
  .bk { position: absolute; width: 16px; height: 66px; background: #222; border: 1px solid #000; border-radius: 0 0 3px 3px; cursor: pointer; z-index: 2; top: 0; }
  .wk.current { background: #ffd966; }
  .bk.current { background: #b8860b; }
  .wk.flash { background: #8fd18f; }
  .bk.flash { background: #2e7d32; }

  /* Readouts */
  .box { background: #2a2a30; border: 1px solid #444; border-radius: 8px; padding: 10px 18px; text-align: center; min-width: 90px; }
  .box .cap { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #888; }
  .box .val { font-size: 26px; font-weight: 700; margin-top: 2px; }
  .box .sub { font-size: 11px; color: #999; margin-top: 2px; }

  /* Velocity spinner */
  #velWrap { display: flex; align-items: center; gap: 10px; }
  #vel { font-size: 40px; font-weight: 800; width: 90px; text-align: center; }
  .spin { display: flex; flex-direction: column; gap: 6px; }
  .spin button { font-size: 20px; width: 54px; height: 40px; cursor: pointer; background: #35353d; color: #ddd; border: 1px solid #555; border-radius: 8px; }
  .spin button:active { background: #50505c; }
  .steps { display: flex; gap: 4px; }
  .steps button { font-size: 12px; padding: 4px 10px; cursor: pointer; background: #2a2a30; color: #aaa; border: 1px solid #444; border-radius: 6px; }
  .steps button.on { background: #4a6b4a; color: #fff; }

  .hint { color: #888; font-size: 12px; }
  #lenWrap input { width: 70px; font-size: 15px; padding: 5px; background: #2a2a30; color: #ddd; border: 1px solid #444; border-radius: 6px; }
  .redact { color: #977; font-size: 10px; }
</style>
</head>
<body>
<h1>HARP PROBE — sandbox v0</h1>
<div id="banner"></div>

<div class="row">
  <select id="inst"></select>
  <span class="hint">routing resolves in the background (port · channel — never a UI decision)</span>
</div>

<div id="kbd"></div>
<div class="hint" style="margin-bottom:12px">click a key to pluck &amp; store it · SPACE re-plucks · ↑ ↓ also step velocity</div>

<div class="row">
  <div class="box"><div class="cap">Note</div><div class="val" id="noteName">—</div><div class="sub" id="noteUvi">UVI: —</div></div>
  <div class="box"><div class="cap">MIDI</div><div class="val" id="noteMidi">—</div></div>
  <div class="box"><div class="cap">Freq</div><div class="val" id="noteFreq">—</div><div class="sub">Hz</div></div>

  <div class="box" id="velWrap">
    <div>
      <div class="cap">Velocity</div>
      <div id="vel">90</div>
      <div class="steps">
        <button data-step="1">±1</button><button data-step="5" class="on">±5</button><button data-step="10">±10</button>
      </div>
    </div>
    <div class="spin">
      <button id="velUp">▲</button>
      <button id="velDn">▼</button>
    </div>
  </div>

  <div class="box" id="lenWrap">
    <div class="cap">Length ms</div>
    <input id="len" type="number" value="2000" min="50" step="250">
    <div class="redact">stopgap — to be redacted (UX_NOTES)</div>
  </div>
</div>

<script src="instruments.js"></script>
<script>
const state = { instKey: 'harp_si2', out: null, note: null, vel: 90, step: 5 };
const $ = id => document.getElementById(id);
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const sci = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
const uvi = m => NAMES[m % 12] + (Math.floor(m / 12) - 2);   // UVI labels middle C (60) as C3
const freq = m => (440 * Math.pow(2, (m - 69) / 12)).toFixed(1);
const inst = () => INSTRUMENTS[state.instKey];

// ---- instrument dropdown (routing stays backstage) ----
for (const [k, v] of Object.entries(INSTRUMENTS)) {
  const o = document.createElement('option'); o.value = k; o.textContent = v.label; $('inst').appendChild(o);
}
$('inst').onchange = e => { state.instKey = e.target.value; buildKeyboard(); resolvePort(); };

// ---- MIDI ----
function banner(msg) { const b = $('banner'); b.style.display = msg ? 'block' : 'none'; b.textContent = msg || ''; }
function resolvePort() {
  state.out = null;
  if (!navigator.requestMIDIAccess) { banner('Web MIDI unavailable — use Chrome.'); return; }
  navigator.requestMIDIAccess().then(acc => {
    for (const out of acc.outputs.values()) if (out.name === inst().port) state.out = out;
    banner(state.out ? '' : `MIDI port "${inst().port}" not found — is loopMIDI running?`);
    acc.onstatechange = () => resolvePort();
  }, () => banner('MIDI access denied.'));
}
function pluck() {
  if (state.note === null) return;
  if (!state.out) { banner(`MIDI port "${inst().port}" not found — is loopMIDI running?`); return; }
  const ch = inst().channel - 1, len = Math.max(50, +$('len').value || 2000);
  state.out.send([0x90 | ch, state.note, state.vel]);
  setTimeout(() => state.out && state.out.send([0x80 | ch, state.note, 0]), len);
  const el = document.querySelector(`[data-m="${state.note}"]`);
  if (el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 180); }
}

// ---- keyboard ----
function buildKeyboard() {
  const kbd = $('kbd'); kbd.innerHTML = '';
  const { rangeLow, rangeHigh } = inst();
  let whiteX = 0;
  for (let m = rangeLow; m <= rangeHigh; m++) {
    const black = [1,3,6,8,10].includes(m % 12);
    const el = document.createElement('div');
    el.dataset.m = m;
    if (black) { el.className = 'bk'; el.style.left = (whiteX - 8) + 'px'; }
    else {
      el.className = 'wk';
      if (m % 12 === 0) el.innerHTML = `<span class="lbl">${sci(m)}</span>`;
      whiteX += 26;
    }
    el.onmousedown = () => { state.note = m; markCurrent(); updateReadouts(); pluck(); };
    kbd.appendChild(el);
  }
}
function markCurrent() {
  document.querySelectorAll('.current').forEach(e => e.classList.remove('current'));
  const el = document.querySelector(`[data-m="${state.note}"]`);
  if (el) el.classList.add('current');
}
function updateReadouts() {
  const m = state.note;
  $('noteName').textContent = m === null ? '—' : sci(m);
  $('noteUvi').textContent = 'UVI: ' + (m === null ? '—' : uvi(m));
  $('noteMidi').textContent = m === null ? '—' : m;
  $('noteFreq').textContent = m === null ? '—' : freq(m);
}

// ---- velocity spinner: every click steps AND plucks ----
function stepVel(dir) {
  state.vel = Math.min(127, Math.max(1, state.vel + dir * state.step));
  $('vel').textContent = state.vel;
  pluck();
}
$('velUp').onclick = () => stepVel(1);
$('velDn').onclick = () => stepVel(-1);
document.querySelectorAll('.steps button').forEach(b => b.onclick = () => {
  state.step = +b.dataset.step;
  document.querySelectorAll('.steps button').forEach(x => x.classList.toggle('on', x === b));
});

// ---- keys: SPACE re-pluck, arrows step velocity ----
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); pluck(); }
  else if (e.code === 'ArrowUp') { e.preventDefault(); stepVel(1); }
  else if (e.code === 'ArrowDown') { e.preventDefault(); stepVel(-1); }
});

buildKeyboard(); resolvePort(); updateReadouts();
</script>
</body>
</html>
