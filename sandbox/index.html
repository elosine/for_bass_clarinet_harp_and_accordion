<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Virtual Instrument Sandbox</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #1e1e22; color: #ddd; }
  h1 { font-size: 15px; font-weight: 600; color: #aaa; margin: 0 0 14px; letter-spacing: 1px; }
  .row { display: flex; align-items: center; gap: 16px; margin: 12px 0; flex-wrap: wrap; }
  select { font-size: 15px; padding: 6px 10px; background: #2a2a30; color: #ddd; border: 1px solid #444; border-radius: 6px; }
  #banner { display: none; background: #7a2a2a; color: #fff; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
  button { cursor: pointer; }

  .tbtn { font-size: 15px; padding: 8px 18px; background: #35353d; color: #ddd; border: 1px solid #555; border-radius: 8px; }
  .tbtn:disabled { opacity: 0.35; cursor: default; }
  #rec.armed { background: #8c2f2f; border-color: #c05050; color: #fff; }
  #loop.on { background: #3d5a3d; border-color: #6a9a6a; color: #fff; }

  /* Technique palette */
  #techs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  #techs button { font-size: 13px; padding: 6px 12px; background: #2a2a30; color: #bbb; border: 1px solid #444; border-radius: 14px; }
  #techs button.on { background: #4a5a7a; border-color: #7a90c0; color: #fff; }

  /* Keyboard */
  #kbd { position: relative; height: 118px; user-select: none; margin: 14px 0 4px; white-space: nowrap; overflow-x: auto; padding-bottom: 6px; }
  .wk { display: inline-block; width: 24px; height: 108px; background: #f4f2ee; border: 1px solid #555; border-radius: 0 0 4px 4px; position: relative; cursor: pointer; vertical-align: top; }
  .wk .lbl { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 9px; color: #666; pointer-events: none; }
  .bk { position: absolute; width: 15px; height: 64px; background: #222; border: 1px solid #000; border-radius: 0 0 3px 3px; cursor: pointer; z-index: 2; top: 0; }
  .wk.current { background: #ffd966; }
  .bk.current { background: #b8860b; }
  .wk.flash { background: #8fd18f; }
  .bk.flash { background: #2e7d32; }

  .box { background: #2a2a30; border: 1px solid #444; border-radius: 8px; padding: 10px 18px; text-align: center; min-width: 84px; }
  .box .cap { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #888; }
  .box .val { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .box .sub { font-size: 11px; color: #999; margin-top: 2px; }
  #velWrap { display: flex; align-items: center; gap: 10px; }
  #vel { font-size: 34px; font-weight: 800; width: 88px; text-align: center; background: transparent; color: #ddd; border: none; border-bottom: 1px solid #555; }
  #vel:focus { outline: none; border-bottom-color: #8fd18f; }
  .spin { display: flex; flex-direction: column; gap: 6px; }
  .spin button { font-size: 18px; width: 50px; height: 38px; background: #35353d; color: #ddd; border: 1px solid #555; border-radius: 8px; }
  .spin button:active { background: #50505c; }
  .steps { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
  .steps button { font-size: 11px; padding: 3px 9px; background: #2a2a30; color: #aaa; border: 1px solid #444; border-radius: 6px; }
  .steps button.on { background: #4a6b4a; color: #fff; }
  #lenWrap input { width: 70px; font-size: 15px; padding: 5px; background: #2a2a30; color: #ddd; border: 1px solid #444; border-radius: 6px; }

  /* Capture strip */
  #cap { display: flex; align-items: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  #capBands { display: flex; gap: 4px; }
  #capBands button { font-size: 12px; padding: 5px 12px; background: #2a2a30; color: #aaa; border: 1px solid #444; border-radius: 6px; }
  #capBands button.on { background: #6b5a2a; border-color: #b09040; color: #fff; }
  #capText { flex: 1; min-width: 260px; font-size: 14px; padding: 8px 10px; background: #2a2a30; color: #ddd; border: 1px solid #444; border-radius: 6px; }
  #capOk { font-size: 12px; color: #8fd18f; min-width: 60px; }

  #laneWrap { margin-top: 16px; }
  #laneCap { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 6px; }
  #lane { height: 140px; background: #26262c; border: 1px solid #444; border-radius: 8px; overflow-x: auto; overflow-y: hidden; }
  #laneContent { position: relative; height: 100%; }
  .blk { position: absolute; background: #6f9fd8; border: 1px solid #8ab4e8; border-radius: 2px; min-width: 3px; height: 5px; }
  #laneInfo { font-size: 11px; color: #888; margin-top: 4px; min-height: 14px; }
</style>
</head>
<body>
<h1>VIRTUAL INSTRUMENT SANDBOX</h1>
<div id="banner"></div>

<div class="row">
  <select id="inst"></select>
  <button class="tbtn" id="rec">⏺ Record</button>
  <button class="tbtn" id="play" disabled>▶ Play</button>
  <button class="tbtn" id="loop">⟳ Loop</button>
  <button class="tbtn" id="clear" disabled>Clear</button>
  <button class="tbtn" id="save" disabled>💾 Save</button>
  <select id="motives"><option value="">— phrases —</option></select>
</div>

<div id="techs"></div>

<div id="kbd"></div>

<div class="row">
  <div class="box"><div class="cap">Note</div><div class="val" id="noteName">—</div><div class="sub" id="noteUvi">UVI: —</div></div>
  <div class="box"><div class="cap">MIDI</div><div class="val" id="noteMidi">—</div></div>
  <div class="box"><div class="cap">Freq</div><div class="val" id="noteFreq">—</div><div class="sub">Hz</div></div>
  <div class="box" id="velWrap">
    <div>
      <div class="cap">Velocity</div>
      <input id="vel" type="number" value="90" min="1" max="127">
      <div class="steps">
        <button data-step="1">±1</button><button data-step="5" class="on">±5</button><button data-step="10">±10</button>
      </div>
    </div>
    <div class="spin">
      <button id="velUp">▲</button>
      <button id="velDn">▼</button>
    </div>
  </div>
  <div class="box" id="lenWrap">
    <div class="cap">Length ms</div>
    <input id="len" type="number" value="2000" min="50" step="250">
  </div>
</div>

<div id="cap">
  <div id="capBands">
    <button data-band="v1">v1</button><button data-band="v2">v2</button><button data-band="v3">v3</button>
  </div>
  <input id="capText" placeholder="timbre note… (ENTER saves with note · velocity · technique attached)">
  <span id="capOk"></span>
</div>

<div id="laneWrap">
  <div id="laneCap">Gesture</div>
  <div id="lane"><div id="laneContent"></div></div>
  <div id="laneInfo"></div>
</div>

<script src="instruments.js"></script>
<script>
const state = { instKey: Object.keys(INSTRUMENTS)[0], techIdx: 0, out: null, inp: null,
                note: null, vel: 90, step: 5, looping: false, loopTimer: null, capBand: null };
const rec = { armed: false, t0: null, active: {}, events: [] };
const $ = id => document.getElementById(id);
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const sci = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
const uvi = m => NAMES[m % 12] + (Math.floor(m / 12) - 2);
const freq = m => (440 * Math.pow(2, (m - 69) / 12)).toFixed(1);
const inst = () => INSTRUMENTS[state.instKey];
const tech = () => inst().techniques[state.techIdx];
const chan = () => tech().channel - 1;

for (const [k, v] of Object.entries(INSTRUMENTS)) {
  const o = document.createElement('option'); o.value = k; o.textContent = v.label; $('inst').appendChild(o);
}
$('inst').onchange = e => { state.instKey = e.target.value; state.techIdx = 0; buildTechs(); buildKeyboard(); resolveBindings(); };

// ---- technique palette: flipping = channel switching, instant ----
function buildTechs() {
  const t = $('techs'); t.innerHTML = '';
  inst().techniques.forEach((tq, i) => {
    const b = document.createElement('button');
    b.textContent = tq.label;
    b.classList.toggle('on', i === state.techIdx);
    b.onclick = () => { state.techIdx = i; buildTechs(); pluck(); };
    t.appendChild(b);
  });
}

function banner(msg) { const b = $('banner'); b.style.display = msg ? 'block' : 'none'; b.textContent = msg || ''; }

// One persistent MIDIAccess; never re-request on statechange (feedback-loop bug, 2026-08-03).
let midiAccess = null, scTimer = null;
function resolveBindings() {
  if (!midiAccess) return;
  let out = null, inp = null;
  for (const o of midiAccess.outputs.values()) if (o.name === inst().port) out = o;
  for (const i of midiAccess.inputs.values()) {
    if (INPUT_MATCH.test(i.name) && !INPUT_EXCLUDE.test(i.name)) { inp = i; break; }
  }
  state.out = out;
  if (state.inp !== inp) {
    if (state.inp) state.inp.onmidimessage = null;
    state.inp = inp;
    if (inp) inp.onmidimessage = onHardwareMidi;
  }
  banner(out ? '' : `MIDI port "${inst().port}" not found — is loopMIDI running?`);
}
function initMidi() {
  if (!navigator.requestMIDIAccess) { banner('Web MIDI unavailable — use Chrome.'); return; }
  navigator.requestMIDIAccess().then(acc => {
    midiAccess = acc;
    acc.onstatechange = () => { clearTimeout(scTimer); scTimer = setTimeout(resolveBindings, 400); };
    resolveBindings();
  }, () => banner('MIDI access denied.'));
}

function sendNote(note, vel, lenMs) {
  if (!state.out) return;
  const ch = chan();
  state.out.send([0x90 | ch, note, vel]);
  setTimeout(() => state.out && state.out.send([0x80 | ch, note, 0]), lenMs);
  flash(note);
}
function flash(note) {
  const el = document.querySelector(`[data-m="${note}"]`);
  if (el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 160); }
}
function pluck() { if (state.note !== null) sendNote(state.note, state.vel, Math.max(50, +$('len').value || 2000)); }

// ---- hardware input: live thru + capture when armed ----
function onHardwareMidi(e) {
  const [st, d1, d2] = e.data, cmd = st & 0xF0, ch = chan();
  const isOn = cmd === 0x90 && d2 > 0, isOff = cmd === 0x80 || (cmd === 0x90 && d2 === 0);
  if (!isOn && !isOff) return;
  if (state.out) state.out.send([(isOn ? 0x90 : 0x80) | ch, d1, isOn ? d2 : 0]);
  if (isOn) { flash(d1); state.note = d1; markCurrent(); updateReadouts(); }
  if (!rec.armed) return;
  const t = e.timeStamp;
  if (isOn) { if (rec.t0 === null) rec.t0 = t; rec.active[d1] = { on: t - rec.t0, vel: d2 }; }
  else if (rec.active[d1]) {
    rec.events.push({ note: d1, vel: rec.active[d1].vel, on: rec.active[d1].on, off: t - rec.t0 });
    delete rec.active[d1];
    renderLane();
  }
}

// ---- record / play / loop / clear ----
$('rec').onclick = () => {
  $('rec').blur();
  stopLoop();
  rec.armed = !rec.armed;
  if (rec.armed && rec.events.length === 0) rec.t0 = null;
  $('rec').classList.toggle('armed', rec.armed);
  $('rec').textContent = rec.armed ? '⏺ Recording…' : '⏺ Record';
  updateButtons();
};
function playPass() {
  if (!state.out || rec.events.length === 0) return 0;
  const ch = chan(), base = performance.now() + 120;
  let dur = 0;
  for (const ev of rec.events) {
    state.out.send([0x90 | ch, ev.note, ev.vel], base + ev.on);
    state.out.send([0x80 | ch, ev.note, 0], base + ev.off);
    setTimeout(() => flash(ev.note), ev.on + 120);
    dur = Math.max(dur, ev.off);
  }
  return dur;
}
$('play').onclick = () => { $('play').blur(); playPass(); };
$('loop').onclick = () => {
  $('loop').blur();
  if (state.looping) { stopLoop(); return; }
  if (rec.events.length === 0) return;
  state.looping = true;
  $('loop').classList.add('on');
  const cycle = () => {
    if (!state.looping) return;
    const dur = playPass();
    state.loopTimer = setTimeout(cycle, dur + 500);
  };
  cycle();
};
function stopLoop() {
  state.looping = false;
  clearTimeout(state.loopTimer);
  $('loop').classList.remove('on');
}
$('clear').onclick = () => { $('clear').blur(); stopLoop(); rec.events = []; rec.active = {}; rec.t0 = null; renderLane(); updateButtons(); };
function updateButtons() {
  $('play').disabled = rec.events.length === 0;
  $('clear').disabled = rec.events.length === 0 && !rec.armed;
  $('save').disabled = rec.events.length === 0;
}

// ---- phrases ----
$('save').onclick = async () => {
  $('save').blur();
  if (rec.events.length === 0) return;
  const name = prompt('Name this phrase:');
  if (!name) return;
  const body = { name, created: new Date().toISOString(), instrument: state.instKey,
                 technique: tech().key, events: rec.events, annotations: [] };
  const r = await fetch('/motives', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.ok) { const { file } = await r.json(); loadMotiveList(file); }
};
async function loadMotiveList(selectFile) {
  try {
    const list = await (await fetch('/motives')).json();
    const sel = $('motives');
    sel.innerHTML = '<option value="">— phrases —</option>';
    for (const m of list) {
      const o = document.createElement('option');
      o.value = m.file; o.textContent = m.name;
      sel.appendChild(o);
    }
    if (selectFile) sel.value = selectFile;
  } catch (e) {}
}
$('motives').onchange = async e => {
  if (!e.target.value) return;
  const m = await (await fetch('/motives/' + e.target.value)).json();
  stopLoop();
  rec.events = m.events || []; rec.active = {}; rec.t0 = null;
  if (m.instrument && INSTRUMENTS[m.instrument] && m.instrument !== state.instKey) {
    state.instKey = m.instrument; $('inst').value = m.instrument; state.techIdx = 0;
    buildTechs(); buildKeyboard(); resolveBindings();
  }
  if (m.technique) {
    const i = inst().techniques.findIndex(t => t.key === m.technique);
    if (i >= 0) { state.techIdx = i; buildTechs(); }
  }
  renderLane();
};

// ---- capture strip: exploring IS documenting ----
document.querySelectorAll('#capBands button').forEach(b => b.onclick = () => {
  state.capBand = state.capBand === b.dataset.band ? null : b.dataset.band;
  document.querySelectorAll('#capBands button').forEach(x => x.classList.toggle('on', x.dataset.band === state.capBand));
});
$('capText').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const comment = $('capText').value.trim();
  if (!comment && !state.capBand) return;
  const body = { created: new Date().toISOString(), instrument: state.instKey, technique: tech().key,
                 note: state.note, noteName: state.note === null ? null : sci(state.note),
                 vel: state.vel, band: state.capBand, comment };
  const r = await fetch('/captures', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.ok) {
    $('capText').value = '';
    $('capOk').textContent = 'saved ✓';
    setTimeout(() => $('capOk').textContent = '', 1500);
  }
});

// ---- gesture lane ----
const PXPS = 60;
function renderLane() {
  const lane = $('lane'), content = $('laneContent'); content.innerHTML = '';
  if (rec.events.length === 0) { content.style.width = '100%'; $('laneInfo').textContent = ''; updateButtons(); return; }
  const dur = Math.max(...rec.events.map(e => e.off), 1);
  const los = Math.min(...rec.events.map(e => e.note)), his = Math.max(...rec.events.map(e => e.note));
  const W = Math.max((dur / 1000) * PXPS + 24, lane.clientWidth);
  const H = lane.clientHeight - 12;
  content.style.width = W + 'px';
  for (const ev of rec.events) {
    const b = document.createElement('div'); b.className = 'blk';
    b.style.left = 4 + (ev.on / 1000) * PXPS + 'px';
    b.style.width = Math.max(3, ((ev.off - ev.on) / 1000) * PXPS) + 'px';
    b.style.top = 6 + (his === los ? H / 2 : (1 - (ev.note - los) / (his - los)) * H) + 'px';
    content.appendChild(b);
  }
  lane.scrollLeft = W;
  $('laneInfo').textContent = `${rec.events.length} notes · ${(dur / 1000).toFixed(2)} s`;
  updateButtons();
}

// ---- on-screen keyboard ----
function buildKeyboard() {
  const kbd = $('kbd'); kbd.innerHTML = '';
  const { rangeLow, rangeHigh } = inst();
  let whiteX = 0;
  for (let m = rangeLow; m <= rangeHigh; m++) {
    const black = [1,3,6,8,10].includes(m % 12);
    const el = document.createElement('div');
    el.dataset.m = m;
    if (black) { el.className = 'bk'; el.style.left = (whiteX - 8) + 'px'; }
    else {
      el.className = 'wk';
      if (m % 12 === 0) el.innerHTML = `<span class="lbl">${sci(m)}</span>`;
      whiteX += 24;
    }
    el.onmousedown = () => { state.note = m; markCurrent(); updateReadouts(); pluck(); };
    kbd.appendChild(el);
  }
}
function markCurrent() {
  document.querySelectorAll('.current').forEach(e => e.classList.remove('current'));
  const el = document.querySelector(`[data-m="${state.note}"]`);
  if (el) el.classList.add('current');
}
function updateReadouts() {
  const m = state.note;
  $('noteName').textContent = m === null ? '—' : sci(m);
  $('noteUvi').textContent = 'UVI: ' + (m === null ? '—' : uvi(m));
  $('noteMidi').textContent = m === null ? '—' : m;
  $('noteFreq').textContent = m === null ? '—' : freq(m);
}

// ---- velocity ----
function setVel(v) { state.vel = Math.min(127, Math.max(1, v)); $('vel').value = state.vel; }
function stepVel(dir) { setVel(state.vel + dir * state.step); pluck(); }
$('velUp').onclick = () => stepVel(1);
$('velDn').onclick = () => stepVel(-1);
$('vel').onchange = () => setVel(+$('vel').value || 90);
document.querySelectorAll('.steps button').forEach(b => b.onclick = () => {
  state.step = +b.dataset.step;
  document.querySelectorAll('.steps button').forEach(x => x.classList.toggle('on', x === b));
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); pluck(); }
  else if (e.code === 'ArrowUp') { e.preventDefault(); stepVel(1); }
  else if (e.code === 'ArrowDown') { e.preventDefault(); stepVel(-1); }
});

buildTechs(); buildKeyboard(); initMidi(); updateReadouts(); loadMotiveList();
</script>
</body>
</html>
